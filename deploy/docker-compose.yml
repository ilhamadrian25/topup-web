# Production stack: app + Postgres 17 + uploads volume. Used by deploy/deploy.sh.
# Everything instance-specific comes from .env next to this file (see deploy/.env.example).

name: ${COMPOSE_PROJECT_NAME:-topup-web}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: topup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topup -d topup"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot `prisma migrate deploy`, run by deploy.sh before the app restarts.
  migrate:
    image: ${IMAGE:?set IMAGE in .env or pass it to deploy.sh}
    profiles: ["tools"]
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql://topup:${POSTGRES_PASSWORD}@db:5432/topup?schema=public
      DIRECT_URL: postgresql://topup:${POSTGRES_PASSWORD}@db:5432/topup?schema=public
    command: ["prisma", "migrate", "deploy"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  app:
    image: ${IMAGE:?set IMAGE in .env or pass it to deploy.sh}
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    # Where your reverse proxy reaches the app. Default: localhost only.
    # A reverse proxy running in another Docker container on this host can use the
    # docker0 address instead, e.g. APP_BIND=172.17.0.1:3000.
    ports:
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 768m
    logging: *logging

volumes:
  pgdata:
  uploads:
