# Stack produksi topupin di VPS — terpisah dari stack payterra (project, network, volume sendiri).
# Lokasi di server: /opt/topupin (lihat deploy/README.md). Dijalankan oleh deploy.sh.
#
# Satu-satunya titik sentuh dengan payterra: nginx payterra (pemilik port 80/443)
# meneruskan topupin.xyz ke 172.17.0.1:3310 — lihat deploy/nginx/topupin.conf.

name: topupin

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: topup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topup -d topup"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sekali jalan sebelum app di-restart: `docker compose run --rm migrate`.
  migrate:
    image: ${IMAGE:-ghcr.io/ilhamadrian25/topup-web:latest}
    profiles: ["tools"]
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql://topup:${POSTGRES_PASSWORD}@db:5432/topup?schema=public
      DIRECT_URL: postgresql://topup:${POSTGRES_PASSWORD}@db:5432/topup?schema=public
    command: ["prisma", "migrate", "deploy"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  app:
    image: ${IMAGE:-ghcr.io/ilhamadrian25/topup-web:latest}
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    # Hanya di docker0 → terjangkau nginx payterra via host.docker.internal, tidak terbuka ke internet.
    ports:
      - "172.17.0.1:3310:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 768m
    logging: *logging

volumes:
  pgdata:
  uploads:
