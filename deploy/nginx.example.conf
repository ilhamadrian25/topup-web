# Example nginx vhost for topup-web. Replace shop.example.com, the certificate paths and
# the upstream (APP_BIND in .env). For nginx running in Docker on the same host, use
# APP_BIND=172.17.0.1:3000 and proxy_pass http://host.docker.internal:3000 (with
# extra_hosts: host.docker.internal:host-gateway on the nginx container).

server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/ssl/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/shop.example.com/privkey.pem;

    # Admin image uploads go through server actions (max 4 MB).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
