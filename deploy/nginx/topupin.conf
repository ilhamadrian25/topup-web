# vhost topupin.xyz untuk nginx payterra (payterra-setup/nginx/conf.d/topupin.conf).
# Cloudflare proxied + origin cert khusus topupin.xyz (bukan origin.crt milik payterra.id):
#   Cloudflare → topupin.xyz → SSL/TLS → Origin Server → Create certificate
#   (topupin.xyz, *.topupin.xyz) → simpan sebagai nginx/ssl/topupin.crt & topupin.key.

server {
    listen 443 ssl;
    http2 on;

    server_name topupin.xyz;

    ssl_certificate     /etc/nginx/ssl/topupin.crt;
    ssl_certificate_key /etc/nginx/ssl/topupin.key;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://www.topupin.xyz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name www.topupin.xyz;

    ssl_certificate     /etc/nginx/ssl/topupin.crt;
    ssl_certificate_key /etc/nginx/ssl/topupin.key;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Upload gambar admin (server action, maks 4 MB).
    client_max_body_size 5m;

    location / {
        # Stack topupin (deploy/docker-compose.yml) publish di docker0:3310.
        proxy_pass http://host.docker.internal:3310;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
