# Build image → push GHCR → deploy ke VPS (stack /opt/topupin, terpisah dari payterra).
#
# Repo secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key, user boleh jalankan docker)
#                 VPS_KNOWN_HOSTS (opsional; output `ssh-keyscan <host>` — kosong = keyscan saat jalan)
# Repo variable:  VPS_DEPLOY = "true" untuk mengaktifkan job deploy (tanpa itu hanya build + push).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts; fi
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HOST" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Sync deploy files
        run: |
          ssh vps 'mkdir -p /opt/topupin'
          scp deploy/docker-compose.yml deploy/deploy.sh deploy/backup.sh deploy/migrate-from-supabase.sh deploy/.env.example vps:/opt/topupin/
          ssh vps 'chmod +x /opt/topupin/*.sh'

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh vps "/opt/topupin/deploy.sh '${{ needs.build.outputs.image }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
