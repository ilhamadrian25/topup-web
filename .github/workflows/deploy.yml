# Build the image → push to GHCR → (optionally) deploy to your server with deploy/deploy.sh.
#
# The deploy job only runs when the repository variable VPS_DEPLOY is "true", so forks just
# build and push. To enable it (see deploy/README.md):
#   secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key of a user that may run docker)
#              VPS_KNOWN_HOSTS (optional; output of `ssh-keyscan <host>`, empty = keyscan at run time)
#   variables: VPS_DEPLOY=true, DEPLOY_DIR (optional, default /opt/topup-web)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/topup-web' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # GHCR needs a lowercase repository path (owners may have uppercase letters).
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts; fi
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HOST" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Sync deploy files
        run: |
          ssh vps "mkdir -p '$DEPLOY_DIR'"
          scp deploy/docker-compose.yml deploy/deploy.sh deploy/backup.sh deploy/migrate-from-supabase.sh deploy/.env.example "vps:$DEPLOY_DIR/"
          ssh vps "chmod +x '$DEPLOY_DIR'/*.sh"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh vps "'$DEPLOY_DIR/deploy.sh' '${{ needs.build.outputs.image }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
